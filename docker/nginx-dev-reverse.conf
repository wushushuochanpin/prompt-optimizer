# Nginx 反代 prompt-optimizer 开发服务（HTTPS）
# 用法：放到 /etc/nginx/sites-available/ 后软链到 sites-enabled，或 include 到 http {} 中
# 需将 ssl_certificate* 改为实际证书路径（如 Let's Encrypt）

upstream prompt_optimizer_web {
    server 127.0.0.1:18181;
}
upstream prompt_optimizer_mcp {
    server 127.0.0.1:3000;
}

server {
    listen 443 ssl http2;
    server_name prompt-optimizer.superchat.help;

    # 证书（请替换为实际路径，如 certbot 生成）
    ssl_certificate     /etc/letsencrypt/live/prompt-optimizer.superchat.help/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/prompt-optimizer.superchat.help/privkey.pem;
    ssl_session_timeout  1d;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Web 前端（Vite dev）
    location / {
        proxy_pass http://prompt_optimizer_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # MCP 服务
    location /mcp {
        proxy_pass http://prompt_optimizer_mcp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Content-Length 0;
            return 204;
        }
    }
}

# HTTP 跳转 HTTPS（可选）
server {
    listen 80;
    server_name prompt-optimizer.superchat.help;
    return 301 https://$host$request_uri;
}
